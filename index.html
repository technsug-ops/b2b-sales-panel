<title>B2B Sales Panel</title>

<style>
/* Leaflet essentials (inlined) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;background:var(--bg);font:12px/1.5 var(--body);touch-action:none;-webkit-tap-highlight-color:transparent;border-radius:10px}
.leaflet-container .leaflet-overlay-pane svg{user-select:none}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right .leaflet-control{float:right;margin-right:10px}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-bar{box-shadow:var(--shadow);border-radius:6px;overflow:hidden}.leaflet-bar a{background:var(--panel);color:var(--fg);border-bottom:1px solid var(--line);width:28px;height:28px;line-height:28px;display:block;text-align:center;text-decoration:none;font-weight:700}.leaflet-bar a:last-child{border-bottom:0}.leaflet-disabled{opacity:.4}
.leaflet-control-attribution{display:none}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:10px;background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}.leaflet-popup-content{margin:12px 14px;line-height:1.4;font-size:13px;min-height:1px}.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:var(--panel)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:2px;right:2px;border:none;text-align:center;width:24px;height:24px;font:16px/24px sans-serif;color:var(--muted);text-decoration:none;background:transparent}
.leaflet-tooltip{position:absolute;padding:4px 8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--fg);white-space:nowrap;box-shadow:var(--shadow);pointer-events:none;font-size:12px}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}.leaflet-interactive{cursor:pointer}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-div-icon{background:transparent;border:0}.leaflet-marker-icon{display:block}.leaflet-tile{filter:none;max-width:none!important;width:256px;height:256px}.leaflet-tile-loaded{visibility:inherit}
.marker-cluster{background-clip:padding-box;border-radius:20px;background:rgba(15,111,140,.22)}.marker-cluster div{width:30px;height:30px;margin-left:5px;margin-top:5px;text-align:center;border-radius:15px;font:12px/30px var(--body);font-weight:700;background:var(--accent);color:var(--accent-fg)}
.leaflet-cluster-anim .leaflet-marker-icon{transition:transform .3s ease-out,opacity .3s ease-in}
.pmk{width:100%;height:100%;border-radius:50%;border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.lmap{width:100%;height:min(62vh,520px);border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.lmap.small{height:360px}
.mapctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mapctl input,.mapctl select{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:13px}
.mapctl input{min-width:160px}
.maplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px;max-height:220px;overflow:auto}
.maplist button{text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);cursor:pointer;display:grid;gap:2px;font-size:12px}
.maplist button:hover{border-color:var(--accent)}.maplist b{font-size:13px}.maplist small{color:var(--muted)}
.pop-btn{margin-top:6px;display:inline-block;background:var(--accent);color:var(--accent-fg);padding:4px 10px;border-radius:6px;font-weight:600;cursor:pointer;border:0;font-size:12px}
</style>
<style>
/* Layout: fixed sidebar + fluid workspace; dashboard = KPI row, Germany map with brand filter, activity feed */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#17222b; --muted:#5d6b76; --line:#dfe5ea;
  --accent:#0f6f8c; --accent-soft:#e3f1f5; --accent-fg:#ffffff;
  --mz:#c2692b; --ec:#4b5fd6; --we:#0f8c7a;
  --ok:#2a8a52; --warn:#c48a12; --crit:#c23b3b;
  --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(23,34,43,.06),0 4px 14px rgba(23,34,43,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --panel:#162027; --fg:#e8eef2; --muted:#93a3ae; --line:#26343d;
  --accent:#4fb4d2; --accent-soft:#17323c; --accent-fg:#0b1418;
  --mz:#e0864a; --ec:#8894f0; --we:#3fc0aa; --ok:#4fc27a; --warn:#e0b04a; --crit:#ef6f6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --panel:#162027; --fg:#e8eef2; --muted:#93a3ae; --line:#26343d;
  --accent:#4fb4d2; --accent-soft:#17323c; --accent-fg:#0b1418;
  --mz:#e0864a; --ec:#8894f0; --we:#3fc0aa; --ok:#4fc27a; --warn:#e0b04a; --crit:#ef6f6f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:600}h2{font-size:16px;font-weight:600}h3{font-size:14px;font-weight:600}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:38px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:11px;flex:none}
.brand b{font-family:var(--display);font-size:15px;display:block;line-height:1.1}.brand small{color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--fg)}
.nav button:hover{background:var(--bg)}.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .ic{width:18px;text-align:center;opacity:.8}
.nav .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:10px;padding:1px 6px;border-radius:99px;font-weight:600}
.navlabel{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 2px}
.rolebox{margin-top:auto;border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.rolebox label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select.sel{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.main{min-width:0;padding-block:16px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
.pill.t{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.langs button{border:0;background:none;padding:6px 10px;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted)}
.langs button.on{background:var(--accent);color:var(--accent-fg)}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.15}
.kpi{padding:10px 14px}
.kpi .d{font-size:12px;color:var(--ok);margin-top:2px}.kpi .d.n{color:var(--crit)}
.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.card .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card .hd .sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.map{width:100%;max-width:100%;max-height:min(62vh,460px);aspect-ratio:600/700;display:block;margin:0 auto}
.card .hd{margin-bottom:6px}
.map .land{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.map .pin{cursor:pointer;transition:r .15s}.map .pin:hover{stroke:var(--fg);stroke-width:2}
.map .lbl{font-size:11px;fill:var(--muted);font-family:var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.feed{display:flex;flex-direction:column;gap:0}
.feed .it{display:grid;grid-template-columns:8px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.feed .it:last-child{border:0}.feed .st{width:8px;height:8px;border-radius:50%;margin-top:6px}
.feed small{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border:0}tbody tr{cursor:pointer}tbody tr:hover td{background:var(--bg)}
.tw{overflow-x:auto}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.tag.mz{color:var(--mz)}.tag.ec{color:var(--ec)}.tag.we{color:var(--we)}
.tier{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.tier.basic{background:var(--bg);color:var(--muted)}.tier.silver{background:#e4e8ec;color:#4a5560}.tier.gold{background:#f6e7b8;color:#7a5a00}.tier.premium{background:var(--fg);color:var(--bg)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.crit{color:var(--crit)}.st.mut{color:var(--muted)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
@media (max-width:1000px){.detail{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.dam{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.asset{padding:0;overflow:hidden}
.asset .th{height:96px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;color:#fff;letter-spacing:.04em}
.asset .bd{padding:10px}.asset .bd b{display:block;font-size:13px}.asset .bd small{color:var(--muted)}
.lock{opacity:.45;position:relative}.lock::after{content:"🔒";position:absolute;top:8px;right:8px}
.notif{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border:0}.notif .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.notif.un{font-weight:500}.notif .ch{margin-left:auto;display:flex;gap:4px;flex:none}
.ch span{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.ai{position:fixed;right:0;top:0;bottom:0;width:360px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20;padding-right:env(safe-area-inset-right,0px);padding-top:env(safe-area-inset-top,0px)}
.ai .hd{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ai .log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--bg);border-bottom-left-radius:3px}
.ai form{display:flex;gap:6px;padding:12px;border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.ai input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-fg);border:0;border-radius:99px;padding:11px 16px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);z-index:15;display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.demo{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:4px 8px}
.rolegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.perm{display:grid;grid-template-columns:1fr repeat(4,56px);font-size:12px;align-items:center}
.perm>div{padding:7px 6px;border-bottom:1px solid var(--line)}
.perm .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.perm .c{text-align:center}
/* Firmenzentrale look */
body.hq{--accent:#1d4e89;--accent-soft:#e6eef8;--accent-fg:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.hq{--accent:#7fb0ea;--accent-soft:#16283d;--accent-fg:#0b1624}}
:root[data-theme="dark"] body.hq{--accent:#7fb0ea;--accent-soft:#16283d;--accent-fg:#0b1624}
body.hq .side{background:#0f2238;color:#e3ecf7;border-right-color:#0f2238}
body.hq .side .nav button{color:#cddbee}body.hq .side .nav button:hover{background:#18324f}
body.hq .side .nav button.on{background:#1d4e89;color:#fff}
body.hq .side .navlabel,body.hq .side .brand small{color:#8fa7c4}
body.hq .brand .mark{background:#b8862b;color:#fff}
.cred-pw{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:.02em}
.doorcard{display:grid;gap:8px;border-top:4px solid var(--dc)}
.doorcard .url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;word-break:break-all}
/* TechNS console look */
body.console{--accent:#5b4fd6;--accent-soft:#ecebfb;--accent-fg:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.console{--accent:#a69df5;--accent-soft:#25234a;--accent-fg:#14122b}}
:root[data-theme="dark"] body.console{--accent:#a69df5;--accent-soft:#25234a;--accent-fg:#14122b}
body.console .side{background:#14122b;color:#e8e6fb;border-right-color:#14122b}
body.console .side .nav button{color:#d6d3f5}body.console .side .nav button:hover{background:#25234a}
body.console .side .nav button.on{background:#5b4fd6;color:#fff}
body.console .side .navlabel,body.console .side .brand small{color:#9a96c9}
body.console .brand .mark{background:#5b4fd6;color:#fff}
body.console #gate .brand .mark{background:#5b4fd6}
/* phase installer */
.phasebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 14px;padding:8px;border:1px dashed var(--line);border-radius:10px;background:var(--panel)}
.phb{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;color:var(--muted);min-width:0}
.phb span{font-size:12px}.phb small{grid-column:2;font-weight:400;font-size:11px;white-space:nowrap}
.phb.next{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);animation:phpulse 1.6s ease-in-out infinite}
.phb.done{color:var(--ok);border-color:var(--ok);cursor:default}
.phb:disabled:not(.done){opacity:.5;cursor:not-allowed}
.phsep{width:18px;height:2px;background:var(--line);display:inline-block}
@keyframes phpulse{0%,100%{box-shadow:0 0 0 0 rgba(15,111,140,.35)}50%{box-shadow:0 0 0 6px rgba(15,111,140,0)}}
#phaseOv{position:fixed;inset:0;z-index:4000;background:rgba(10,20,26,.45);display:grid;place-items:center;padding:16px}
.phbox{width:100%;max-width:520px;background:var(--panel);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.phhd{display:grid;gap:2px}.phhd b{font-family:var(--display);font-size:18px}.phhd small{color:var(--muted)}
.phbox ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.phbox li{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted);padding:6px 8px;border-radius:7px}
.phbox li.run{color:var(--fg);background:var(--bg)}.phbox li.ok{color:var(--fg)}.phbox li.ok .phst{color:var(--ok)}
.phst{width:18px;text-align:center;font-weight:700}
@media (prefers-reduced-motion:reduce){.phb.next{animation:none}}
/* best-practice page */
.bp{max-width:960px}
.bp h2{font-size:18px;margin:26px 0 10px;display:flex;align-items:center;gap:10px}

function mapSVG(list,{small=false}={}){

  const col={leadgen:'var(--muted)',freelancer:'var(--warn)',partner:'var(--accent)',distributor:'var(--crit)'};

let TEAM={list:null,roles:null,loading:false,last:null,err:'',editRole:null};
async function teamLoad(){TEAM.loading=true;try{if(GATE_API){const r=await gateApi({action:'team_list',token:gateToken()});if(r.ok){TEAM.list=r.team;TEAM.roles=r.roles}else TEAM.err='Keine Berechtigung.'}else{TEAM.list=localTeam();TEAM.roles=localRoles()}}catch(e){TEAM.err=t('gate.neterr')}TEAM.loading=false;render()}
async function teamAct(action,extra){
  if(GATE_API){const r=await gateApi({action,token:gateToken(),...extra});if(!r.ok){toast(({self:'Eigenen Zugang nicht sperren',inuse:'Rolle ist noch Personen zugewiesen',builtin:'Standardrolle kann nicht gelöscht werden',locked:'Geschäftsführer-Rolle ist fest',name:'Bitte Rollennamen eingeben'})[r.error]||'Fehler');return}if(r.pass)TEAM.last={name:r.member.name,user:r.member.user,pass:r.pass};}
  else if(action.startsWith('team_role_')){const R=localRoles();if(action==='team_role_save'){let x=R.find(y=>y.key===extra.key);if(x&&x.locked){toast('Geschäftsführer-Rolle ist fest');return}if(x){x.name=extra.name;x.perms=extra.perms}else R.push({key:extra.name.toLowerCase().replace(/[^a-z0-9]+/g,'-'),name:extra.name,perms:extra.perms})}else{const x=R.find(y=>y.key===extra.key);if(x.builtin){toast('Standardrolle kann nicht gelöscht werden');return}if(localTeam().some(m=>m.role===x.key)){toast('Rolle ist noch Personen zugewiesen');return}R.splice(R.indexOf(x),1)}saveLocalRoles(R)}
  else{const L=localTeam();const W=['Zelt','Regen','Anker','Wolke'];const pw=()=>W[Math.floor(Math.random()*4)]+'-'+Math.floor(1000+Math.random()*9000)+'-halle';
    if(action==='team_add'){const m={id:Math.max(...L.map(x=>x.id))+1,name:extra.name||'Mitarbeiter',role:extra.role,user:(extra.name||'user').toLowerCase().replace(/[^a-z0-9]+/g,'-'),pass:pw(),active:true,created:Date.now()};L.push(m);TEAM.last={name:m.name,user:m.user,pass:m.pass}}
    else{const m=L.find(x=>x.id===extra.id);if(action==='team_reset'){m.pass=pw();TEAM.last={name:m.name,user:m.user,pass:m.pass}}if(action==='team_toggle')m.active=!m.active;if(action==='team_role')m.role=extra.role}
    saveLocalTeam(L)}
  AUDIT.unshift({who:TEAMNAME||'Geschäftsführung',what:'Team: '+({team_add:'Konto angelegt',team_reset:'Passwort neu',team_toggle:'Zugang geändert',team_role:'Rolle geändert',team_role_save:'Rolle gespeichert',team_role_delete:'Rolle gelöscht'})[action]+(extra.name?' · '+extra.name:''),when:new Date().toISOString().slice(0,16).replace('T',' ')});
  await teamLoad();
}

  try{
    if(GATE_API){const r=await gateApi({action:'pcreds_sync',token:gateToken(),partners:payload});if(r.ok){CREDS.list=r.creds;CREDS.err=''}else CREDS.err='Keine Berechtigung – bitte neu anmelden.'}
    else CREDS.list=localCreds();

  else{const L=localCreds();const c=L.find(x=>x.id===id);if(action==='pcreds_reset'){c.pass=['Zelt','Regen','Anker','Wolke'][Math.floor(Math.random()*4)]+'-'+String(Math.floor(1000+Math.random()*9000))+'-'+['halle','linde','brise'][Math.floor(Math.random()*3)]}else c.active=!c.active;saveLocalCreds(L);CREDS.list=L}

  render();
}

  v.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{try{await gateApi({action:'revoke',admin:codesState.admin,id:b.dataset.revoke})}catch(e){}codesLoad()});
  if(page==='codes'&&CONSOLE&&isMaster()&&codesState.admin&&codesState.list===null&&GATE_API){codesState.list=[];codesLoad()}
  /* DAM publish */
  const dpo=$('#dpubOpen');if(dpo)dpo.onclick=()=>{dpubOpen=true;render()};
  const dpc=$('#dpubCancel');if(dpc)dpc.onclick=()=>{dpubOpen=false;render()};
  const dpRe=()=>{dpub.name=$('#dp_name').value;dpub.kind=$('#dp_kind').value;dpub.b=$('#dp_brand').value;dpub.min=$('#dp_min').value;dpub.states=[...$('#dp_states').selectedOptions].map(o=>o.value);dpub.partners=[...$('#dp_partners').selectedOptions].map(o=>+o.value);dpub.types=[...v.querySelectorAll('[data-dpt]:checked')].map(c=>c.dataset.dpt);dpub.notify=[...v.querySelectorAll('[data-dpn]:checked')].map(c=>c.dataset.dpn);dpub.use=[...v.querySelectorAll('[data-dpu]:checked')].map(c=>c.dataset.dpu);render()};
  ['dp_kind','dp_brand','dp_min','dp_states','dp_partners'].forEach(id=>{const e=$('#'+id);if(e)e.onchange=dpRe});
  v.querySelectorAll('[data-dpt],[data-dpn],[data-dpu]').forEach(c=>c.onchange=dpRe);
  const dpn=$('#dp_name');if(dpn)dpn.onchange=()=>{dpub.name=dpn.value};
  mountMaps();
}

/* ---------- access gate (server-checked: master code + one-time codes via /api/gate) ---------- */
const GATE_HASH="70ecb282a5f0e87bc2396479c072c93726ff16f5d0abbbc855a556a80178c2a5";
const GATE_API=location.protocol.startsWith('http')&&!/claudeusercontent|claude\.ai/.test(location.host)?'/api/gate':null;
async function sha256(str){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function gateApi(payload){const r=await fetch(GATE_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});return r.json()}
function gateToken(){try{return sessionStorage.getItem(GKEY)}catch(e){return null}}
function tokenExp(tok){try{if(!tok||tok.startsWith('local:'))return null;const p=JSON.parse(atob(tok.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')));return p.exp||null}catch(e){return null}}
let expTimer=null,expTick=null;
function lockAt(exp){clearTimeout(expTimer);clearInterval(expTick);const pill=$('#expPill');if(!exp){if(pill)pill.hidden=true;return}
  const lock=()=>{try{sessionStorage.removeItem(GKEY);sessionStorage.removeItem(KKEY)}catch(e){}$('#gatePw').value='';$('#gateErr').textContent=t('gate.expired');$('#notes').hidden=true;$('#ai').hidden=true;showGate()};
  const ms=exp-Date.now();if(ms<=0){lock();return}
  expTimer=setTimeout(lock,ms);
  const upd=()=>{const r=exp-Date.now();if(r<=0)return;const h=Math.floor(r/3600e3),m=Math.floor(r%3600e3/60e3),sec=Math.floor(r%60e3/1e3);if(pill){pill.hidden=false;pill.textContent='⏱ '+t('gate.left')+' '+(h?h+' h ':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}};
  upd();expTick=setInterval(upd,1000)}
function isMaster(){try{return sessionStorage.getItem(KKEY)==='master'}catch(e){return false}}
function setKind(k){try{sessionStorage.setItem(KKEY,k)}catch(e){}}
function showGate(){$('#gate').hidden=false;document.body.classList.add('locked');document.body.style.overflow='hidden';setTimeout(()=>$('#gatePw').focus(),50)}
function hideGate(){$('#gate').hidden=true;document.body.classList.remove('locked');document.body.style.overflow='';MAPS.forEach(({map})=>{try{map.invalidateSize()}catch(e){}})}
const HQ_HASH="452c0761ac11cd00638eaff6d2b1e4e08da7c46e071092f4b8bd16dc2009b00b";
const DENY={console:'Die Konsole ist nur mit dem Master-Code zugänglich.',zentrale:'Die Firmenzentrale ist nur mit dem Zentrale-Code zugänglich.',root:'Bitte den Eingang der Firmenzentrale bzw. Ihr Partner-Portal verwenden.'};
function doorAllows(kind,sub){
  if(CONSOLE)return kind==='master';
  if(HQ)return kind==='hq';
  if(PDOOR)return kind==='partner'&&String(sub||'').endsWith(':'+DOOR);
  return kind==='master'||kind==='once'||kind==='team';
}
function kindOfSub(sub){return sub==='master'?'master':sub==='hq'?'hq':String(sub||'').startsWith('p:')?'partner':String(sub||'').startsWith('t:')?'team':'once'}
function setTeam(role,name,perms,roleName){TEAMROLE=role||null;TEAMNAME=name||null;if(perms)TEAMPERMS=perms;if(roleName)TEAMROLENAME=roleName;if(!role){TEAMPERMS=null;TEAMROLENAME=null}try{if(role){sessionStorage.setItem(RKEY,role);sessionStorage.setItem(RKEY+':n',name||'');if(perms)sessionStorage.setItem(RKEY+':p',JSON.stringify(perms));if(roleName)sessionStorage.setItem(RKEY+':r',roleName)}else{[RKEY,RKEY+':n',RKEY+':p',RKEY+':r'].forEach(k=>sessionStorage.removeItem(k))}}catch(e){}}
function enterAs(kind,tok,pid){try{sessionStorage.setItem(GKEY,tok);if(pid){sessionStorage.setItem(PKEY,pid)}}catch(x){}if(kind!=='team')setTeam(null);setKind(kind);PID=pid||PID;hideGate();page=CONSOLE?'chome':HQ?'hqhome':'dash';render();lockAt(kind==='once'?tokenExp(tok):null)}
/* offline (artifact) partner credentials */
function localCreds(){let c=null;try{c=JSON.parse(localStorage.getItem('b2b-creds')||'null')}catch(e){}
  if(!c){const W=['Zelt','Regen','Stahl','Halle','Wasser','Anker','Wolke','Linde'];c=PARTNERS.map((p,i)=>({id:p.id,name:p.name,doors:[...new Set(p.roles.map(r=>r.t))],user:p.name.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24),pass:W[i%W.length]+'-'+String(1000+i*137%9000)+'-'+W[(i+3)%W.length].toLowerCase(),active:true,created:Date.now(),logins:0}));try{localStorage.setItem('b2b-creds',JSON.stringify(c))}catch(e){}}
  return c}
function localTeam(){let t=null;try{t=JSON.parse(localStorage.getItem('b2b-team')||'null')}catch(e){}
  if(!t){t=[{id:1,name:'Geschäftsführung',role:'gf',user:'geschaeftsfuehrung',pass:'Aydemir-GF-2026',active:true,created:Date.now()},{id:2,name:'Technik-Verantwortlicher',role:'tech',user:'technik',pass:'Aydemir-Tech-2026',active:true,created:Date.now()},{id:3,name:'Verwaltung',role:'staff',user:'verwaltung',pass:'Aydemir-Team-2026',active:true,created:Date.now()}];try{localStorage.setItem('b2b-team',JSON.stringify(t))}catch(e){}}
  return t}
function localRoles(){let r=null;try{r=JSON.parse(localStorage.getItem('b2b-roles')||'null')}catch(e){}
  if(!r){r=[{key:'gf',name:'Geschäftsführer',perms:PERM_KEYS.slice(),builtin:true,locked:true},{key:'tech',name:'Technik-Verantwortlicher',perms:['partners','leads','projects','orders','dam','settings','creds'],builtin:true},{key:'staff',name:'Verwaltung',perms:['partners','leads','projects','orders','dam'],builtin:true}];try{localStorage.setItem('b2b-roles',JSON.stringify(r))}catch(e){}}
  return r}
function saveLocalRoles(r){try{localStorage.setItem('b2b-roles',JSON.stringify(r))}catch(e){}}
function saveLocalTeam(t){try{localStorage.setItem('b2b-team',JSON.stringify(t))}catch(e){}}
function saveLocalCreds(c){try{localStorage.setItem('b2b-creds',JSON.stringify(c))}catch(e){}}
$('#gateForm').onsubmit=async e=>{e.preventDefault();const code=$('#gatePw').value.trim();const user=($('#gateUser').value||'').trim().toLowerCase();if(!code||(PDOOR&&!user))return;const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent=t('gate.wait');$('#gateErr').textContent='';
  try{
    if(PDOOR){
      if(GATE_API){const r=await gateApi({action:'plogin',door:DOOR,user,pass:code});if(r.ok)enterAs('partner',r.token,r.pid);else{$('#gateErr').textContent='Benutzername oder Passwort ist falsch – oder Ihr Zugang ist gesperrt.';$('#gatePw').select()}}
      else{const c=localCreds().find(x=>x.user===user&&x.pass===code&&x.active&&x.doors.includes(DOOR));if(c){c.logins=(c.logins||0)+1;c.lastLogin=Date.now();saveLocalCreds(localCreds().map(x=>x.id===c.id?c:x));enterAs('partner','local:p:'+c.id+':'+DOOR,c.id)}else{$('#gateErr').textContent='Benutzername oder Passwort ist falsch – oder Ihr Zugang ist gesperrt.'}}
    }else if(!CONSOLE&&user){
      if(GATE_API){const r=await gateApi({action:'tlogin',user,pass:code});if(r.ok){setTeam(r.role,r.name,r.perms,r.roleName);enterAs('team',r.token)}else{$('#gateErr').textContent='Benutzername oder Passwort ist falsch – oder Ihr Zugang ist gesperrt.';$('#gatePw').select()}}
      else{const m=localTeam().find(x=>x.user===user&&x.pass===code&&x.active);if(m){m.lastLogin=Date.now();m.logins=(m.logins||0)+1;saveLocalTeam(localTeam().map(x=>x.id===m.id?m:x));const R=localRoles().find(x=>x.key===m.role)||{perms:[],name:m.role};setTeam(m.role,m.name,R.perms,R.name);enterAs('team','local:t:'+m.id+':'+m.role)}else{$('#gateErr').textContent='Benutzername oder Passwort ist falsch – oder Ihr Zugang ist gesperrt.'}}
    }else if(GATE_API){const r=await gateApi({action:'login',code});
      if(r.ok&&doorAllows(r.kind))enterAs(r.kind,r.token);
      else if(r.ok){$('#gateErr').textContent=CONSOLE?DENY.console:HQ?DENY.zentrale:DENY.root;$('#gatePw').select()}
      else{$('#gateErr').textContent=t('gate.err');$('#gatePw').select()}}
    else{const h=await sha256(code);const kind=h===GATE_HASH?'master':h===HQ_HASH?'hq':null;
      if(kind&&doorAllows(kind))enterAs(kind,'local:'+kind);else{$('#gateErr').textContent=kind?(CONSOLE?DENY.console:HQ?DENY.zentrale:DENY.root):t('gate.err');$('#gatePw').select()}}
  }catch(x){$('#gateErr').textContent=t('gate.neterr')}
  btn.disabled=false;btn.textContent=t('gate.btn')};
(async()=>{const tok=gateToken();if(!tok){showGate();return}
  if(tok.startsWith('local:')){const sub=tok.slice(6);if(!doorAllows(kindOfSub(sub),sub)){showGate()}else if(kindOfSub(sub)==='team'){const R=localRoles().find(x=>x.key===sub.split(':')[2]);setTeam(sub.split(':')[2],TEAMNAME,R?R.perms:[],R?R.name:'');render()}return}
  if(GATE_API){try{const r=await gateApi({action:'verify',token:tok});
    if(!r.ok||!doorAllows(kindOfSub(r.sub),r.sub)){try{sessionStorage.removeItem(GKEY)}catch(x){}showGate()}
    else{const k=kindOfSub(r.sub);setKind(k);if(k==='partner'){PID=+String(r.sub).split(':')[1]}if(k==='team'){setTeam(String(r.sub).split(':')[2],TEAMNAME,r.perms,TEAMROLENAME)}else setTeam(null);render();lockAt(k==='once'?(r.exp||tokenExp(tok)):null)}}catch(x){/* keep session on network hiccup */}}
  else showGate()})();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);const nd=DOOR_LIST.includes(h)?h:'';if(nd!==DOOR)location.reload()});
render();
