<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#16151d;--muted:#5d5b6a;--line:#e3e1da;--acc:#5a4fe0;--acc2:#e8e5ff;--warm:#f2a93b;--ok:#2f855a;--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.1;margin:0 0 .4em;letter-spacing:-.02em}
h1{font-size:clamp(38px,6vw,68px);font-weight:800}h2{font-size:clamp(28px,3.6vw,42px);font-weight:700}h3{font-size:19px;font-weight:600}
a{color:inherit}p{margin:0 0 1em}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:12px 22px;font:600 15px 'Public Sans',sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn.ghost{background:transparent;color:var(--ink)}.btn.acc{background:var(--acc);border-color:var(--acc)}

header.sc{border-color:var(--line)}
.hd{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font:700 20px 'Bricolage Grotesque',sans-serif;text-decoration:none}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
nav.mn{display:flex;gap:22px;margin-left:12px}nav.mn a{text-decoration:none;color:var(--muted);font-size:15px}nav.mn a:hover{color:var(--ink)}
.sp{flex:1}.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.lang button{border:0;background:none;padding:6px 10px;font:600 12px 'Public Sans';color:var(--muted);cursor:pointer}.lang button.on{background:var(--ink);color:#fff}
.login{position:relative}.login>button{border:0;background:none;font:500 15px 'Public Sans';cursor:pointer;color:var(--ink)}
.login .dd{position:absolute;right:0;top:36px;width:290px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.25);display:none;font-size:14px}
.login.open .dd{display:block}.login .dd a{display:block;margin-top:10px;font-weight:600;color:var(--acc)}
.hero{padding:72px 0 40px;position:relative;overflow:hidden}
.hero .eb{display:inline-flex;gap:8px;align-items:center;background:var(--acc2);color:var(--acc);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;margin-bottom:22px}
.hero p.lead{font-size:20px;color:var(--muted);max-width:640px;margin:18px 0 30px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--warm) 62%,var(--warm) 90%,transparent 90%)}
.net{margin-top:52px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:center}
.node{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;background:var(--bg)}
.node b{display:block;font-size:14px}.node.c{background:var(--ink);color:#fff;border-color:var(--ink);text-align:center}.node.c small{color:#bdb9d6}
.arr{text-align:center;color:var(--acc);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}.kpi b{display:block;font:700 28px 'Bricolage Grotesque'}.kpi small{color:var(--muted)}
section{padding:76px 0}section.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sh{max-width:720px;margin-bottom:34px}.sh p{color:var(--muted);font-size:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card .n{font:800 15px 'Bricolage Grotesque';color:var(--acc);margin-bottom:10px}
.card p{color:var(--muted);margin:0}
.core{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.core div{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);font-weight:600;font-size:15px}
.core div small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font:600 14px 'Public Sans';cursor:pointer;color:var(--muted)}
.tabs button.on{border-color:var(--ink);color:#fff;background:var(--ink)}
.line{display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;align-items:start}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mod{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.mod b{display:block;font-size:15px}.mod small{color:var(--muted);font-size:13px;display:block;line-height:1.45}
.mod .sz{float:right;font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.06em}
.case{border-left:4px solid var(--warm);background:#fffaf0;border-radius:0 12px 12px 0;padding:14px 16px;font-size:15px}
.case b{display:block;margin-bottom:4px}
.size{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.size .card h3{display:flex;justify-content:space-between;align-items:baseline}.size .card h3 small{font:500 13px 'Public Sans';color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chips span{background:var(--acc2);color:var(--acc);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.sec{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sec .card b{display:block;margin-bottom:4px}
form.ct{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.ct label{display:grid;gap:6px;font-size:14px;font-weight:600}
form.ct input,form.ct select,form.ct textarea{font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
form.ct input:focus,form.ct select:focus,form.ct textarea:focus{outline:none;border-color:var(--acc)}
form.ct .full{grid-column:1/-1}form.ct .chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:13.5px;color:var(--muted)}form.ct .chk input{width:auto;margin-top:3px}
.hp{position:absolute;left:-9999px}
.msg{padding:12px 14px;border-radius:10px;font-weight:600}.msg.ok{background:#e6f4ec;color:var(--ok)}.msg.err{background:#fdecea;color:#b42318}
footer{padding:40px 0 60px;color:var(--muted);font-size:14px}
footer .row{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
dialog{max-width:640px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:16px;padding:26px}dialog::backdrop{background:rgba(22,21,29,.45)}
dialog h3{margin-top:0}dialog p{font-size:14.5px;color:var(--muted)}
@media(max-width:920px){nav.mn{display:none}.net,.line{grid-template-columns:1fr}.g3,.size,.sec{grid-template-columns:1fr}.g4,.core{grid-template-columns:1fr 1fr}.mods{grid-template-columns:1fr}}

  if(!d.name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)||!d.consent){m.className='msg err';m.textContent=t.err;return}
  var btn=f.querySelector('button[type=submit]');btn.disabled=true;
  fetch('/api/gate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(r){if(r&&r.ok){m.className='msg ok';m.textContent=t.ok;f.reset()}else{m.className='msg err';m.textContent=r&&r.error==='input'?t.err:t.err2}}).catch(function(){m.className='msg err';m.textContent=t.err2}).then(function(){btn.disabled=false})};
draw();
})();
</script>
</body>
